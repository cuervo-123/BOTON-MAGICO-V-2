<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tech Blue • One Button MULTI (Clones Autónomos)</title>
<meta name="color-scheme" content="dark">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
  :root{
    --accent:#1f8bff;
    --accent2:#4ac3ff;
    --ink:#eaf2ff;
    --muted:#a9c0ff;
    --line: rgba(255,255,255,.14);
    --desk: rgba(10,14,32,.10);

    --btnW: 360px;
    --btnH: 98px;
    --round: 22px;

    --radius: 160px;
    --drawerW: 480px;
    --shadow: 0 22px 80px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:transparent;overflow:hidden}

  body::before{
    content:"";
    position:fixed; inset:-40px;
    background:
      radial-gradient(820px 420px at 50% 45%, color-mix(in oklab, var(--desk) 75%, transparent), transparent 62%),
      radial-gradient(520px 280px at 35% 35%, color-mix(in oklab, var(--accent) 14%, transparent), transparent 64%),
      radial-gradient(520px 280px at 65% 65%, color-mix(in oklab, var(--accent2) 10%, transparent), transparent 64%);
    pointer-events:none;
    filter: blur(10px);
    opacity:.95;
  }

  /* ===== Multi Instances Layer ===== */
  .world{
    position:fixed; inset:0;
  }
  .tbInst{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
  }

  @media (max-width: 520px){
    :root{ --btnW: min(360px, calc(100vw - 16px)); --radius: min(160px, calc(50vw - 38px)); }
  }

  /* ===== Core Card ===== */
  .core{
    position:relative;
    width:var(--btnW); height:var(--btnH);
    border-radius:var(--round);
    border:1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)),
      radial-gradient(420px 160px at 20% 0%, color-mix(in oklab, var(--accent) 26%, transparent), transparent 58%),
      radial-gradient(420px 160px at 80% 120%, color-mix(in oklab, var(--accent2) 18%, transparent), transparent 58%),
      rgba(0,0,0,.14);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow);
    user-select:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 14px 16px; gap:10px;
    transform: translateZ(0);
    cursor:pointer;
  }

  .core.dragging{ cursor:grabbing; }
  .core .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .core .logo{
    width:44px;height:44px;border-radius:16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border:1px solid rgba(255,255,255,.18);
    box-shadow: 0 14px 30px color-mix(in oklab, var(--accent) 24%, transparent);
    flex:0 0 auto;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  .core .txt{min-width:0}
  .core .txt b{display:block;color:var(--ink);font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .core .txt small{display:block;color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .actions{display:flex; gap:8px; align-items:center; flex:0 0 auto;}
  .chip{
    border:1px solid rgba(255,255,255,.14);
    background: rgba(94, 93, 93, 0.546);
    color: var(--ink);
    padding:9px 10px;
    border-radius:14px;
    font-size:12px;
    cursor:pointer;
  }
  .chip:active{ transform: translateY(1px); }

  /* ===== Card background overlay (image bg mode) ===== */
  .coreBgOverlay{
    position:absolute; inset:0;
    border-radius: var(--round);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: .35;
    pointer-events:none;
    filter: saturate(1.05) contrast(1.05);
    mix-blend-mode: screen;
  }

  /* ===== Spider ===== */
  .spider{position:absolute; left:50%; top:50%; width:1px; height:1px; pointer-events:none;}
  .leg{
    position:absolute; left:50%; top:50%;
    height:2px; transform-origin:left center;
    opacity:0; width:0;
    background: linear-gradient(90deg, rgba(31,139,255,.0), rgba(31,139,255,.55), rgba(74,195,255,.22));
    filter: drop-shadow(0 0 10px rgba(31,139,255,.25));
    transition: width .28s ease, opacity .28s ease;
  }
  .node{
    position:absolute; width:56px; height:56px;
    border-radius:18px;
    transform: translate(-50%,-50%) scale(.72);
    opacity:0;
    pointer-events:auto;
    display:grid; place-items:center;
    border:1px solid rgba(255,255,255,.14);
    background:
      radial-gradient(120px 70px at 30% 30%, rgba(255,255,255,.10), transparent 60%),
      rgba(12,18,44,.85);
    box-shadow: 0 18px 45px rgba(0,0,0,.45);
    transition: transform .28s ease, opacity .28s ease, filter .28s ease;
    backdrop-filter: blur(10px);
  }
  .node:hover{ filter: brightness(1.12); transform: translate(var(--tx), var(--ty)) translate(-50%,-50%) scale(.80); }
  .node i{font-style:normal;font-size:20px;}
  .nodeLabel{
    position:absolute; top:calc(100% + 8px); left:50%;
    transform:translateX(-50%);
    font-size:11px; color:rgba(233,242,255,.9);
    padding:6px 8px; border-radius:999px;
    border:1px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.22);
    white-space:nowrap;
  }

  .node[data-a="0"]   { --ux:  0;    --uy: -1; }
  .node[data-a="45"]  { --ux:  0.707;--uy: -0.707; }
  .node[data-a="90"]  { --ux:  1;    --uy:  0; }
  .node[data-a="135"] { --ux:  0.707;--uy:  0.707; }
  .node[data-a="180"] { --ux:  0;    --uy:  1; }
  .node[data-a="225"] { --ux: -0.707;--uy:  0.707; }
  .node[data-a="270"] { --ux: -1;    --uy:  0; }
  .node[data-a="315"] { --ux: -0.707;--uy: -0.707; }

  .open .node{
    opacity:1;
    --tx: calc(var(--ux) * var(--radius));
    --ty: calc(var(--uy) * var(--radius));
    transform: translate(var(--tx), var(--ty)) translate(-50%,-50%) scale(.78);
  }
  .open .leg{ opacity:1; width: calc(var(--radius) - 22px); }

  .leg[data-a="0"]   { transform: translate(0,-1px) rotate(-90deg); }
  .leg[data-a="45"]  { transform: translate(0,-1px) rotate(-45deg); }
  .leg[data-a="90"]  { transform: translate(0,-1px) rotate( 0deg); }
  .leg[data-a="135"] { transform: translate(0,-1px) rotate( 45deg); }
  .leg[data-a="180"] { transform: translate(0,-1px) rotate( 90deg); }
  .leg[data-a="225"] { transform: translate(0,-1px) rotate(135deg); }
  .leg[data-a="270"] { transform: translate(0,-1px) rotate(180deg); }
  .leg[data-a="315"] { transform: translate(0,-1px) rotate(-135deg); }

  /* ===== Drawer (per instance) ===== */
  .drawer{
    position:fixed; top:50%; right:18px;
    transform: translateY(-50%);
    width:min(var(--drawerW), calc(100vw - 36px));
    max-height: min(86vh, 820px);
    overflow:auto;
    overflow-x:hidden;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.14);
    background:
      radial-gradient(560px 240px at 15% 0%, rgba(31,139,255,.18), transparent 60%),
      rgba(10,14,32,.86);
    box-shadow: 0 30px 90px rgba(0,0,0,.65);
    backdrop-filter: blur(12px);
    display:none; z-index:20;
  }
  .drawer.show{ display:block; }
  .dTop{
    position:sticky; top:0;
    padding:12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.10);
    background: rgba(10,14,32,.80);
    backdrop-filter: blur(12px);
  }
  .dTop b{ font-size:13px; color:rgba(233,242,255,.95); }
  .xbtn{
    border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color:var(--ink);
    border-radius:12px;
    padding:9px 10px;
    cursor:pointer;
  }
  .dBody{ padding:12px; display:grid; gap:10px; }

  .card{
    border:1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    border-radius:18px;
    padding:12px;
  }
  .card h3{ margin:0 0 6px 0; font-size:12px; }
  .card p{ margin:0 0 10px 0; font-size:12px; color:var(--muted); line-height:1.35; }

  input,textarea{
    width:100%;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.14);
    background: rgba(0,0,0,.22);
    color:var(--ink);
    padding:10px 12px;
    outline:none;
    font-size:13px;
  }
  textarea{ min-height:120px; resize:vertical; }

  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 12px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.14);
    background: rgba(31,139,255,.12);
    color:var(--ink);
    cursor:pointer;
    font-size:13px;
  }
  .btn.secondary{ background: rgba(255,255,255,.06); }
  .btn.good{ background: rgba(32,201,151,.14); }
  .btn.bad{ background: rgba(239,71,111,.14); }

  .list{ display:grid; gap:8px; max-height:320px; overflow:auto; overflow-x:hidden; padding-right:4px; }
  .channelGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:10px;
    max-height:420px;
    overflow:auto;
    overflow-x:hidden;
    padding:2px 4px 2px 2px;
  }
  .channelCard{
    min-width:0;
    border:1px solid rgba(255,255,255,.12);
    background:
      radial-gradient(160px 90px at 20% 0%, rgba(31,139,255,.16), transparent 62%),
      rgba(0,0,0,.20);
    border-radius:18px;
    padding:10px;
    display:grid;
    gap:8px;
    box-shadow:0 14px 34px rgba(0,0,0,.24);
  }
  .channelPoster{
    width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:
      radial-gradient(90px 54px at 50% 38%, rgba(74,195,255,.32), transparent 64%),
      linear-gradient(135deg, rgba(31,139,255,.22), rgba(74,195,255,.10));
    display:grid;
    place-items:center;
    overflow:hidden;
  }
  .channelPoster img{ width:100%; height:100%; object-fit:contain; padding:8px; }
  .channelPoster .fallback{ font-size:26px; filter:drop-shadow(0 0 12px rgba(31,139,255,.35)); }
  .channelName{
    min-width:0;
    color:var(--ink);
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .channelMeta{
    min-width:0;
    color:var(--muted);
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .channelActions{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .channelActions .btn{ padding:8px 6px; font-size:12px; border-radius:12px; }
  @media (max-width:520px){
    .channelGrid{ grid-template-columns:repeat(auto-fill, minmax(138px, 1fr)); }
    .channelActions{ grid-template-columns:1fr; }
  }
  .item{
    border:1px solid rgba(255,255,255,.10);
    background: rgba(0,0,0,.18);
    border-radius:16px;
    padding:10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .item small{ display:block; color:var(--muted); margin-top:2px; }
  .tag{
    font-size:11px;
    padding:6px 8px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color:rgba(233,242,255,.9);
    white-space:nowrap;
  }

  /* player */
  .playerWrap{
    border:1px solid rgba(255,255,255,.10);
    border-radius:16px;
    overflow:hidden;
    background: rgba(0,0,0,.20);
  }
  video{ width:100%; height:auto; display:block; background:#000; }

  /* toast */
  .toast{
    position:fixed;
    left:50%; bottom:16px;
    transform:translateX(-50%);
    background: rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.14);
    color:var(--ink);
    border-radius:999px;
    padding:10px 12px;
    font-size:12px;
    display:none;
    z-index:60;
    backdrop-filter: blur(10px);
  }
  .toast.show{ display:block; }

  /* PiP per instance */
  .pip{
    position:fixed;
    left: 22px;
    bottom: 22px;
    width: 380px;
    max-width: calc(100vw - 44px);
    border-radius:18px;
    border:1px solid rgba(255,255,255,.14);
    background:
      radial-gradient(520px 220px at 15% 0%, rgba(31,139,255,.18), transparent 60%),
      rgba(10,14,32,.88);
    box-shadow: 0 30px 90px rgba(0,0,0,.70);
    backdrop-filter: blur(12px);
    display:none;
    z-index:80;
    overflow:hidden;
  }
  .pip.show{ display:block; }
  .pipHead{
    padding:10px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.10);
    cursor: grab;
    user-select:none;
  }
  .pipHead:active{ cursor: grabbing; }
  .pipTitle{
    min-width:0;
    color:rgba(233,242,255,.95);
    font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pipBtns{ display:flex; gap:8px; flex:0 0 auto; }
  .pipBtn{
    border:1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color:var(--ink);
    border-radius:12px;
    padding:7px 9px;
    cursor:pointer;
    font-size:12px;
  }
  .pipBody{ padding:10px; }

/* MORPH V1: visual surface only; spider and drawer remain unclipped */
.core.morphOn{width:min(var(--morphW),calc(100vw - 16px));height:min(var(--morphH),calc(100vh - 16px));height:min(var(--morphH),calc(100dvh - 16px));background:none;border-color:transparent;box-shadow:none;backdrop-filter:none;isolation:isolate;}
.core.morphOn::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:1px solid var(--accent);border-radius:var(--morphR);clip-path:var(--morphClip);background:var(--morphFill);opacity:var(--morphOpacity);box-shadow:inset 0 0 var(--morphGlow) var(--accent);}
.core.morphOn .coreBgOverlay{border-radius:var(--morphR);clip-path:var(--morphClip);z-index:-1;}
.core.morphOn .left,.core.morphOn .actions{position:relative;}
.core.morphOn.morphStack{flex-direction:column;justify-content:center;gap:8px;padding:12px;}
.core.morphStack .left{flex-direction:column;width:72%;text-align:center;gap:5px;}
.core.morphStack .txt{max-width:100%;}

.touchGrip{display:none;}
/* V1.6: mobile flow, presentation only; desktop DNA untouched. */
@media (max-width: 700px), (hover: none) and (pointer: coarse) and (max-width: 950px){
 .world{overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 12px 32px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom));}
 .tbInst{position:relative;left:var(--touchDX,0px)!important;top:var(--touchDY,0px)!important;transform:none!important;flex:none;max-width:100%;}
 .tbInst.touchMoving{z-index:32;}
 .touchGrip{display:block!important;position:absolute;top:0;left:50%;transform:translate(-50%,-45%);z-index:35;min-width:44px;height:28px;border:1px solid #71849a;border-radius:12px;background:#15283c;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;font-size:17px;}
 .tbInst:has(.core.open),.tbInst:has(.drawer.show){z-index:30;}
 .core,.core.morphOn{width:var(--mobileW, min(360px, calc(100vw - 24px)));height:var(--mobileH,98px);max-width:calc(100vw - 24px);padding:8px;gap:5px;touch-action:pan-y;}
 .core .logo{width:32px;height:32px;border-radius:10px;}
 .core .left{gap:5px;}.core .chip{padding:6px;font-size:11px;}.core .actions{gap:4px;}
 .core.morphStack{padding:6px;gap:4px;}.core.morphStack .left{gap:3px;}
 .core:not(.open) .node{pointer-events:none;}
 .core.open{z-index:31;}
 .drawer{right:8px;width:calc(100vw - 16px);}
}
</style>
</head>
<body>

<div class="world" id="world"></div>
<div class="toast" id="toast">Listo</div>

<script>window.__CUERVO_TOKEN__="__TOKEN_PLACEHOLDER__";</script>
<script>
/* =========================
   Tech Blue MULTI Instance Engine
   - Clones autónomos
   - Estado por instancia (localStorage key único)
   - Drag por instancia (posición guardada)
========================= */

const toastEl = document.getElementById("toast");
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(window.__t);
  window.__t = setTimeout(()=>toastEl.classList.remove("show"), 1400);
}

function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function hexToRgba(hex, a){
  const h = hex.replace("#","");
  const r = parseInt(h.slice(0,2),16);
  const g = parseInt(h.slice(2,4),16);
  const b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function isHlsUrl(url){ return /\.m3u8(\?|#|$)/i.test(url || ""); }
function isMediaUrl(url){ return /\.(mp4|webm|ogg)(\?|#|$)/i.test(url || "") || isHlsUrl(url); }


function cleanUrl(u){
  return String(u||"").trim().replace(/^['"]+|['"]+$/g,"");
}
function looksLikeUrl(u){ return /^https?:\/\//i.test(String(u||"").trim()); }
function fileBaseName(name){ return String(name||"Archivo").replace(/\.[^.]+$/,""); }
function parseListContent(raw, fallbackName="Importado"){
  raw = String(raw||"").trim();
  const out=[];
  const seen=new Set();
  function push(name,url,group="",logo=""){
    url=cleanUrl(url); if(!looksLikeUrl(url) || seen.has(url)) return;
    logo=cleanUrl(logo);
    seen.add(url);
    out.push({ name:(name||fallbackName||"Canal").trim(), url, group:(group||"").trim(), logo:looksLikeUrl(logo)?logo:"", type:isMediaUrl(url)?"media":"link" });
  }

  // W3U / JSON: supports {groups:[{name,stations/channels/items:[...]}]} or arrays
  if((raw.startsWith("{") || raw.startsWith("["))){
    try{
      const data=JSON.parse(raw);
      const walk=(node, group="")=>{
        if(!node) return;
        if(Array.isArray(node)){ node.forEach(x=>walk(x,group)); return; }
        if(typeof node==="object"){
          const g=node.group || node.category || node.groupTitle || node.group_title || node.titleGroup || group || "";
          const name=node.name || node.title || node.tvg_name || node.label || node.channel || fallbackName;
          const url=node.url || node.link || node.stream || node.stream_url || node.src || node.href || node.play || node.file;
          const logo=node.logo || node.tvg_logo || node.tvgLogo || node.icon || node.image || node.poster || node.thumbnail || node.img || "";
          if(url) push(name,url,g,logo);
          ["groups","channels","stations","items","list","playlist","data","entries"].forEach(k=>{
            if(node[k]) walk(node[k], g || node.name || node.title || group);
          });
        }
      };
      walk(data);
      if(out.length) return out;
    }catch(_){ }
  }

  // HTML: anchors, iframes, video/source tags
  if(/<\s*(a|iframe|video|source)\b/i.test(raw)){
    try{
      const doc=new DOMParser().parseFromString(raw,"text/html");
      doc.querySelectorAll("a[href], iframe[src], video[src], source[src]").forEach((el,i)=>{
        const url=el.getAttribute("href") || el.getAttribute("src");
        const name=(el.textContent||el.getAttribute("title")||el.getAttribute("aria-label")||el.getAttribute("alt")||`${fallbackName} ${i+1}`).trim();
        const nearImg=(el.querySelector&&el.querySelector("img")) || el.closest?.("li,div,article,section")?.querySelector?.("img");
        const logo=nearImg ? (nearImg.getAttribute("src") || nearImg.getAttribute("data-src") || nearImg.getAttribute("data-original") || "") : "";
        push(name,url,"",logo);
      });
      if(out.length) return out;
    }catch(_){ }
  }

  // M3U/M3U8 or plain URL list
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let pendingName="", pendingGroup="", pendingLogo="";
  for(const line of lines){
    if(line.startsWith("#EXTINF")){
      const m=line.match(/,(.*)$/); pendingName=(m&&m[1]?m[1].trim():fallbackName);
      const g=line.match(/group-title=["']?([^"',]+)["']?/i); pendingGroup=(g&&g[1]?g[1].trim():"");
      const tvg=line.match(/tvg-name=["']?([^"']+)["']?/i); if(tvg&&tvg[1]) pendingName=tvg[1].trim();
      const logo=line.match(/tvg-logo=["']?([^"']+)["']?/i); pendingLogo=(logo&&logo[1]?logo[1].trim():"");
      continue;
    }
    if(line.startsWith("#")) continue;
    if(looksLikeUrl(line)){
      push(pendingName || fileBaseName(line.split('/').pop()||fallbackName), line, pendingGroup, pendingLogo);
      pendingName=""; pendingGroup=""; pendingLogo="";
    }
  }
  return out;
}
function downloadTextFile(filename, text){
  const blob=new Blob([text],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 800);
}

function uid(){

function normalizeMorph(v){
  v=v&&typeof v==='object'?v:{};
  const choice=(x,a,d)=>a.includes(x)?x:d;
  const num=(x,a,b,d)=>typeof x==='number'&&Number.isFinite(x)?Math.max(a,Math.min(b,x)):d;
  const shape=choice(v.shape,['original','rounded','rectangle','circle','hexagon','pill'],'original');
  return {shape,width:num(v.width,160,700,360),height:num(v.height,98,500,180),material:choice(v.material,['glass','solid','dark'],'glass'),opacity:num(v.opacity,.2,1,.85),glow:num(v.glow,0,60,18)};
}

const MOBILE_MEMORY_KEY='mobile-layout-v1';
let mobileMemory=Object.create(null), mobileWriteTail=Promise.resolve();
async function initMobileMemory(){
 try{const saved=await activeTx('readonly',o=>o.get(MOBILE_MEMORY_KEY));
 if(saved&&typeof saved==='object')for(const [id,p] of Object.entries(saved))if(p&&Number.isFinite(p.dx)&&Number.isFinite(p.dy))mobileMemory[id]=p;
 }catch(e){console.warn('Mobile memory unavailable',e);setTimeout(()=>toast('Device Memory: lectura no disponible'),500);}
}
function persistMobileMemory(){
 const snapshot=Object.fromEntries(Object.entries(mobileMemory));
 const next=mobileWriteTail.catch(()=>{}).then(()=>activeTx('readwrite',o=>o.put(snapshot,MOBILE_MEMORY_KEY)));
 mobileWriteTail=next;next.catch(()=>{});return next;
}
function applyMobileMemory(inst){
 const p=mobileMemory[inst.dataset.id];if(!p)return;
 const core=inst.querySelector('.core'), r=core.getBoundingClientRect(), b=WORLD.getBoundingClientRect();
 const oldX=parseFloat(inst.style.getPropertyValue('--touchDX'))||0,oldY=parseFloat(inst.style.getPropertyValue('--touchDY'))||0;
 const baseX=r.left-oldX,baseY=r.top-oldY+WORLD.scrollTop;
 const clamp=(v,min,max)=>Math.max(min,Math.min(Math.max(min,max),v));
 const dx=clamp(p.dx,b.left+8-baseX,b.right-r.width-8-baseX);
 const dy=clamp(p.dy,b.top+18-baseY,Math.max(b.bottom,b.top+WORLD.scrollHeight)-r.height-8-baseY);
 inst.style.setProperty('--touchDX',dx+'px');inst.style.setProperty('--touchDY',dy+'px');
}
function mobileDimensions(w,h,vw,vh,stack=false){
 const maxW=Math.max(1,vw-32),maxH=Math.max(stack?116:84,Math.min(170,Math.floor((vh-110)/4)));
 const ratio=Math.min(1,maxW/w,maxH/h);
 return {w:Math.round(w*ratio),h:Math.round(h*ratio)};
}
function layoutMobile(){
 if(!MOBILE_LAYOUT.matches)return;
 for(const inst of WORLD.querySelectorAll('.tbInst')){
  const c=inst.querySelector('.core'); if(!c)continue;
  const morph=c.classList.contains('morphOn'), stack=c.classList.contains('morphStack');
  const w=morph?parseFloat(c.style.getPropertyValue('--morphW'))||360:360;
  const h=morph?parseFloat(c.style.getPropertyValue('--morphH'))||98:98;
  const d=mobileDimensions(w,h,WORLD.clientWidth,window.visualViewport?.height||innerHeight,stack);
  c.style.setProperty('--mobileW',d.w+'px');c.style.setProperty('--mobileH',d.h+'px');
 }
 for(const inst of WORLD.querySelectorAll('.tbInst'))if(!inst.classList.contains('touchMoving'))applyMobileMemory(inst);
}
/* Cross-device viewport recovery: display only; saved Stage remains unchanged. */
function fitButtonPosition(x,y,w,h,vw,vh){
  const clamp=(v,max)=>Math.max(8,Math.min(Math.max(8,max),v));
  const valid=Number.isFinite(x)&&Number.isFinite(y);
  const outside=valid&&(x<0||y<0||x+w>vw||y+h>vh);
  if(!valid||outside) return {x:clamp((vw-w)/2,vw-w-8),y:clamp((vh-h)/2,vh-h-8)};
  return {x,y};
}
function fitButtonViewport(inst,x,y){
  if(MOBILE_LAYOUT.matches){layoutMobile();return;}
  const core=inst.querySelector('.core');
  const p=fitButtonPosition(x,y,core.offsetWidth,core.offsetHeight,innerWidth,innerHeight);
  inst.style.left=p.x+'px'; inst.style.top=p.y+'px';
  inst.style.transform='none';
}
window.addEventListener('resize',()=>{
  if(MOBILE_LAYOUT.matches){layoutMobile();return;}
  WORLD.querySelectorAll('.tbInst').forEach(inst=>{
    const r=inst.getBoundingClientRect();
    fitButtonViewport(inst,r.left,r.top);
  });
});

/* ====== Create / Clone ====== */
function createInstance({ id=null, state=null, place="center" }={}){
  const instId = id || uid();
  const st = state ? JSON.parse(JSON.stringify(state)) : loadState(instId);

  // mount DOM
  const wrap = document.createElement("div");
  wrap.innerHTML = instanceHTML(instId);
  const inst = wrap.firstElementChild;
  WORLD.appendChild(inst);

  // initial position
  if(innerWidth<=520 || (st.pos.x!=null && st.pos.y!=null)){
    fitButtonViewport(inst,st.pos.x,st.pos.y);
  }

  // init logic
  initInstance(inst, instId, st);

  if(innerWidth<=520 || (st.morph && normalizeMorph(st.morph).shape!=="original")){
    const r=inst.getBoundingClientRect(); fitButtonViewport(inst,r.left,r.top);
  }

  layoutMobile();
  // persist index
  const idx = loadIndex();
  if(!idx.includes(instId)){
    idx.push(instId);
    saveIndex(idx);
  }

  return instId;
}

function deployButtonState(raw, sourceInst=null){
  if(!raw || typeof raw!=="object" || Array.isArray(raw) || typeof raw.title!=="string") throw Error("JSON de botón inválido");
  const d=defaultState(), st={...d,...JSON.parse(JSON.stringify(raw)),pos:{x:8,y:8},nowPlaying:{...d.nowPlaying,...(raw.nowPlaying||{})}};
  for(const k of ["links","socials","playlists","favs","queue"]) if(!Array.isArray(st[k])) throw Error("Lista inválida: "+k);
  if(st.morph) st.morph=normalizeMorph(st.morph);
  const id=uid(); saveState(id,st);
  try{
    createInstance({id,state:st,place:"manual"});
    if(MOBILE_LAYOUT.matches){layoutMobile();return id;}
    const el=WORLD.querySelector('[data-id="'+id+'"]'), core=el.querySelector('.core');
    const w=core.offsetWidth,h=core.offsetHeight, mx=Math.max(8,innerWidth-w-8),my=Math.max(8,innerHeight-h-8);
    const others=[...WORLD.querySelectorAll('.tbInst')].filter(e=>e!==el).map(e=>e.querySelector('.core').getBoundingClientRect());
    const r=sourceInst?.querySelector('.core').getBoundingClientRect();
    const clamp=(v,m)=>Math.max(8,Math.min(m,v));
    const candidates=r?[[r.right+16,r.top],[r.left,r.bottom+16],[r.left-w-16,r.top],[r.left,r.top-h-16],[r.left+45,r.top+45]]:[];
    for(let y=8;y<=my;y+=Math.max(24,Math.floor(h/3))) for(let x=8;x<=mx;x+=Math.max(24,Math.floor(w/3))) candidates.push([x,y]);
    candidates.push([mx,my],[8,my],[mx,8]);
    const overlap=(x,y)=>others.reduce((sum,o)=>sum+Math.max(0,Math.min(x+w,o.right)-Math.max(x,o.left))*Math.max(0,Math.min(y+h,o.bottom)-Math.max(y,o.top)),0);
    const points=candidates.map(([x,y])=>[clamp(x,mx),clamp(y,my)]);
    points.sort((a,b)=>overlap(...a)-overlap(...b));
    const [x,y]=points[0]; fitButtonViewport(el,x,y);
    // Update the live state as well as the saved state.
    el.dispatchEvent(new CustomEvent('tb-position-commit'));
    return id;
  }catch(e){WORLD.querySelector('[data-id="'+id+'"]')?.remove();removeActive(id);saveIndex(loadIndex().filter(x=>x!==id));throw e;}
}
async function cloneInstance(fromId){
  const source=WORLD.querySelector('[data-id="'+fromId+'"]');
  deployButtonState(loadState(fromId),source); await flushActive();
  toast("Clonado DNA ✅ (autónomo)");
}

/* STAGE LIBRARY V1 — isolated from launcher and original persistence */
const STAGE_FORMAT = 'tech-blue-one-button-stage-v1';
function stageDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open('tb_onebutton_stage_library_v1',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('stages',{keyPath:'id'});
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
async function stageStore(mode,action){
  const db=await stageDB();
  try{return await new Promise((resolve,reject)=>{
    const tx=db.transaction('stages',mode), req=action(tx.objectStore('stages'));
    tx.oncomplete=()=>resolve(req.result); tx.onabort=()=>reject(tx.error||Error('Storage aborted'));
    tx.onerror=()=>reject(tx.error||Error('Storage error'));
  });}finally{db.close();}
}
function captureStage(name,id=uid()){
  const buttons=loadIndex().map(id=>({id,state:loadState(id)}));
  if(!buttons.length) throw Error('No hay botones para guardar');
  return {format:STAGE_FORMAT,id,name,updated:new Date().toISOString(),buttons};
}
function validateStage(x){
  if(!x||x.format!==STAGE_FORMAT||typeof x.name!=='string'||!x.name.trim()||!Array.isArray(x.buttons)||!x.buttons.length) throw Error('JSON de Stage inválido');
  const ids=new Set();
  for(const b of x.buttons){
    if(!b||typeof b.id!=='string'||!/^[-a-zA-Z0-9_]+$/.test(b.id)||ids.has(b.id)||!b.state||typeof b.state!=='object'||Array.isArray(b.state)) throw Error('Botón inválido');
    ids.add(b.id);
  }
  return x;
}
async function restoreStage(stage){
 validateStage(stage);await flushActive();const previous=activeCache;const next=new Map(activeCache);
 for(const id of loadIndex())next.delete(keyFor(id));for(const b of stage.buttons)next.set(keyFor(b.id),JSON.stringify(b.state));next.set(INDEX_KEY,JSON.stringify(stage.buttons.map(b=>b.id)));
 await activeTx('readwrite',o=>o.put([...next],'active'));activeCache=next;
}
function mountStageLibrary(inst){
  let pendingStage=null;
  const q=x=>inst.querySelector(x), list=q('#stageList'), msg=q('#stageStatus');
  const report=e=>{msg.textContent='Error: '+(e.message||e);};
  const run=fn=>async()=>{try{await fn();}catch(e){report(e);}};
  const put=x=>stageStore('readwrite',s=>s.put(x));
  async function draw(){
    const all=await stageStore('readonly',s=>s.getAll());
    list.replaceChildren();
    all.sort((a,b)=>b.updated.localeCompare(a.updated));
    for(const stage of all){
      const card=document.createElement('div'); card.className='card';
      const title=document.createElement('b'); title.textContent=stage.name;
      const info=document.createElement('p'); info.textContent=stage.buttons.length+' botones · '+new Date(stage.updated).toLocaleString();
      const row=document.createElement('div'); row.className='row';
      function button(label,fn){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=run(fn);row.append(b);}
      button('Load Stage',async()=>{if(!confirm('Cargar '+stage.name+'? Se reemplazará el setup activo. Se guardará una copia de recuperación.'))return;const recovery=captureStage('Recovery · '+new Date().toLocaleString());await put(recovery);await restoreStage(stage);location.reload();});
      button('Update Stage',async()=>{if(!confirm('Actualizar este Stage con el setup actual?'))return;await put(captureStage(stage.name,stage.id));await draw();msg.textContent='Stage actualizado';});
      button('Export JSON',()=>downloadTextFile('one-button-stage-'+stage.id+'.json',JSON.stringify(stage,null,2)));
      button('Delete',async()=>{if(!confirm('Eliminar Stage '+stage.name+'?'))return;await stageStore('readwrite',s=>s.delete(stage.id));await draw();});
      card.append(title,info,row);list.append(card);
    }
    if(!all.length)list.textContent='No hay Stages guardados.';
  }
  q('#stageSave').onclick=run(async()=>{const name=q('#stageName').value.trim();if(!name)throw Error('Escribe un nombre');await put(captureStage(name));await draw();msg.textContent='Stage guardado';q('#stageName').value='';});
  async function selectStage(raw){
    pendingStage=null; q('#stageDeploy').disabled=true;
    const x=validateStage(raw); pendingStage={...x,id:uid(),updated:new Date().toISOString()};
    await put(pendingStage); q('#stageDeploy').disabled=false;
    await draw(); msg.textContent='Stage importado: '+x.name+' · pulsa Deploy Stage';
  }
  q('#stageImport').onchange=run(async()=>{const f=q('#stageImport').files[0];if(!f)return;pendingStage=null;q('#stageDeploy').disabled=true;await selectStage(JSON.parse(await f.text()));q('#stageImport').value='';});
  q('#stageDeploy').onclick=run(async()=>{if(!pendingStage)return;if(!confirm('Deploy '+pendingStage.name+'? Se reemplazará el setup activo con copia de recuperación.'))return;await put(captureStage('Recovery · '+new Date().toLocaleString()));await restoreStage(pendingStage);location.reload();});
  draw().catch(report);
}

/* =========================
   INSTANCE LOGIC (scoped)
========================= */
function initInstance(inst, id, state){
  // scoped query
  const $ = (q, el=inst)=> el.querySelector(q);
  const $$= (q, el=inst)=> Array.from(el.querySelectorAll(q));

  // elements
  const core   = $(".core");
  const logo   = $(".logo");
  const titleE = $(".tTitle");
  const subE   = $(".tSub");

  const drawer = $(".drawer");
  const dTitle = $(".dTitle");
  const dBody  = $(".dBody");

  const pip    = $(".pip");
  const pipHead= $(".pipHead");
  const pipTitle= $(".pipTitle");
  const pipSlot= $(".pipSlot");

  // per instance HLS + video
  let hlsInstance = null;
  let videoEl = null;

  // file input per instance (logo)
  const cardFile = document.createElement("input");
  cardFile.type="file"; cardFile.accept="image/*"; cardFile.style.display="none";
  inst.appendChild(cardFile);

  function applyMorph(){
    const m=normalizeMorph(state.morph), enabled=m.shape!=="original";
    core.classList.toggle("morphOn",enabled);
    core.classList.toggle("morphStack",enabled&&["circle","hexagon"].includes(m.shape));
    if(!enabled)return;
    const circle=m.shape==="circle", stack=circle||m.shape==="hexagon";
    const side=Math.max(32,Math.min(Math.max(180,Math.min(m.width,m.height)),innerWidth-16,innerHeight-16));
    const w=circle?side:m.width, h=circle?side:stack?Math.max(180,m.height):m.height;
    const vars={W:w+"px",H:h+"px",R:circle?"50%":m.shape==="pill"?"999px":m.shape==="rectangle"?"3px":"22px",Clip:m.shape==="hexagon"?"polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)":"none",Fill:m.material==="solid"?"var(--accent)":m.material==="dark"?"#080d17":"linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,transparent),rgba(12,20,35,.85))",Opacity:m.opacity,Glow:m.glow+"px"};
    Object.entries(vars).forEach(([k,v])=>core.style.setProperty("--morph"+k,String(v)));
  }
  function applyTheme(){
    applyMorph();
    // theme is global variables; but each instance can set its own look by using inline style vars on inst
    inst.style.setProperty("--accent", state.accent);
    inst.style.setProperty("--accent2", state.accent2);
    document.documentElement.style.setProperty("--desk", state.desk); // background shared
  }
  function save(silent=false){
    saveState(id, state);
    applyTheme();
    applyCardLogo();
    applyText();
    layoutMobile();
    if(!silent) toast("Guardado ✅");
  }

  function applyText(){
    titleE.textContent = state.title || "Tech Blue • One Button";
    subE.textContent   = state.sub   || "Click/Enter: araña • Esc: cerrar";
  }

  // background overlay per instance
  let bgOverlay = null;
  function ensureBgOverlay(){
    if(bgOverlay) return bgOverlay;
    bgOverlay = document.createElement("div");
    bgOverlay.className="coreBgOverlay";
    core.insertBefore(bgOverlay, core.firstChild);
    return bgOverlay;
  }

  function applyCardLogo(){
    const img = state.cardLogoDataUrl || "";
    const mode = state.cardLogoMode || "icon";
    const op = typeof state.cardBgOpacity==="number" ? state.cardBgOpacity : 0.35;

    // reset
    logo.style.backgroundImage = "";
    logo.style.background = "linear-gradient(135deg, var(--accent), var(--accent2))";
    if(bgOverlay) bgOverlay.style.backgroundImage = "";

    if(mode==="icon"){
      if(img){
        logo.style.backgroundImage = `url('${img}')`;
        logo.style.backgroundSize = "cover";
      }
      return;
    }

    // bg mode
    if(img){
      const ov = ensureBgOverlay();
      ov.style.backgroundImage = `url('${img}')`;
      ov.style.opacity = String(op);
    }
  }

  function fileToDataUrl(file){
    return new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(String(r.result||""));
      r.onerror=reject;
      r.readAsDataURL(file);
    });
  }
  function resizeImageDataUrl(dataUrl, maxSide=512){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>{
        const w=img.width,h=img.height;
        const scale=Math.min(1, maxSide/Math.max(w,h));
        const nw=Math.max(1, Math.round(w*scale));
        const nh=Math.max(1, Math.round(h*scale));
        const c=document.createElement("canvas");
        c.width=nw; c.height=nh;
        c.getContext("2d").drawImage(img,0,0,nw,nh);
        try{ resolve(c.toDataURL("image/webp",0.86)); }
        catch(_){ resolve(c.toDataURL("image/png")); }
      };
      img.onerror=reject;
      img.src=dataUrl;
    });
  }
  function openCardImagePicker(){
    cardFile.value="";
    cardFile.click();
  }
  cardFile.addEventListener("change", async ()=>{
    const file = cardFile.files && cardFile.files[0];
    if(!file) return;
    const dataUrl = await fileToDataUrl(file);
    try{ state.cardLogoDataUrl = await resizeImageDataUrl(dataUrl, 512); }
    catch(_){ state.cardLogoDataUrl = dataUrl; }
    save(true);
    toast("Logo cargado ✅");
    if(dTitle.textContent.includes("Look")) renderLook();
  });
  logo.addEventListener("click",(e)=>{ e.stopPropagation(); openCardImagePicker(); });

  // ===== Drawer =====
  function showDrawer(t){
    dTitle.textContent=t;
    drawer.classList.add("show");
    drawer.setAttribute("aria-hidden","false");
  }
  function hideDrawer(){
    drawer.classList.remove("show");
    drawer.setAttribute("aria-hidden","true");
  }
  $(".dClose").addEventListener("click", hideDrawer);

  // ===== Video/HLS =====
  function destroyHls(){
    if(hlsInstance){ try{ hlsInstance.destroy(); }catch(_){ } hlsInstance=null; }
  }
  function ensureVideo(){
    if(videoEl) return videoEl;
    videoEl = document.createElement("video");
    videoEl.setAttribute("controls","");
    videoEl.setAttribute("playsinline","");
    videoEl.style.width="100%";
    videoEl.style.height="auto";
    videoEl.style.background="#000";
    videoEl.addEventListener("ended", ()=>{ if(state.autoNext) playNextFromQueue(); });
    return videoEl;
  }
  function waitForCanPlay(video, ms=2500){
    return new Promise((resolve,reject)=>{
      let done=false;
      const t=setTimeout(()=>{ if(done) return; done=true; cleanup(); reject(new Error("timeout")); }, ms);
      function cleanup(){
        clearTimeout(t);
        video.removeEventListener("canplay", on);
        video.removeEventListener("loadedmetadata", on);
      }
      function on(){ if(done) return; done=true; cleanup(); resolve(); }
      video.addEventListener("canplay", on, {once:true});
      video.addEventListener("loadedmetadata", on, {once:true});
    });
  }

  function updatePipTitle(){
    const np=state.nowPlaying||{};
    pipTitle.textContent="PiP • " + (np.name||"—");
  }
  function showPiP(){ pip.classList.add("show"); state.pipOn=true; save(true); updatePipTitle(); }
  function hidePiP(){ pip.classList.remove("show"); state.pipOn=false; save(true); }

  function dockToPiP(){
    const v=ensureVideo();
    pipSlot.innerHTML="";
    pipSlot.appendChild(v);
    showPiP();
  }

  function dockToDrawer(){
    const slot = inst.querySelector("#dockSlot");
    const v = ensureVideo();
    if(!slot) return;
    slot.innerHTML="";
    slot.appendChild(v);
    hidePiP();
  }

  async function playInline(url, name=""){
    url=(url||"").trim();
    if(!url) return toast("URL vacía");
    state.nowPlaying={name:name||"Now Playing", url};
    state.playerUrl=url;
    save(true);
    updatePipTitle();

    const v=ensureVideo();
    try{
      destroyHls();
      v.pause();
      v.removeAttribute("src");
      v.load();
      v.muted=true; // start muted ✅

      if(state.pipOn) dockToPiP();
      // else it will be docked in drawer when player module opens

      if(isHlsUrl(url)){
        if(window.Hls && Hls.isSupported()){
          hlsInstance = new Hls({ enableWorker:true, lowLatencyMode:true });
          hlsInstance.loadSource(url);
          hlsInstance.attachMedia(v);
          await waitForCanPlay(v, 3000).catch(()=>{});
          await v.play().catch(()=>{});
        }else if(v.canPlayType("application/vnd.apple.mpegurl")){
          v.src=url;
          await waitForCanPlay(v, 3000).catch(()=>{});
          await v.play().catch(()=>{});
        }else{
          toast("Este navegador no reproduce .m3u8 ❌");
          return;
        }
      }else{
        v.src=url;
        await waitForCanPlay(v, 3000).catch(()=>{});
        await v.play().catch(()=>{});
      }

      const nowName = inst.querySelector("#nowName");
      const nowUrl  = inst.querySelector("#nowUrl");
      if(nowName) nowName.textContent = state.nowPlaying.name || "Now Playing";
      if(nowUrl)  nowUrl.textContent  = state.nowPlaying.url || "";
      toast("Reproduciendo (muted) ▶️");
    }catch(_){
      toast("No se pudo reproducir ❌");
    }
  }
  function stopInline(){
    const v=ensureVideo();
    destroyHls();
    try{ v.pause(); }catch(_){}
    try{ v.removeAttribute("src"); v.load(); }catch(_){}
    toast("Stop ⏹️");
  }

  // ===== Queue/Favs =====
  function addToQueue(item, mode="end"){
    state.queue = state.queue || [];
    const obj={...item, id: uid()};
    if(mode==="next") state.queue.unshift(obj);
    else state.queue.push(obj);
    save(true);
    toast(mode==="next" ? "Añadido Next ⏭️" : "Añadido a Queue ✅");
  }
  function playNextFromQueue(){
    state.queue = state.queue || [];
    if(!state.queue.length) return toast("Queue vacía");
    const next = state.queue.shift();
    save(true);
    playInline(next.url, next.name||"Queue");
    const qList = inst.querySelector("#qList");
    if(qList) renderQueueSection();
  }
  function addFav(item){
    state.favs = state.favs || [];
    state.favs.unshift({ ...item, id: uid() });
    save(true);
  }

  // ===== PiP controls =====
  $(".pipClose").onclick=()=>hidePiP();
  $(".pipDock").onclick=()=>{ dockToDrawer(); toast("Docked 📎"); };
  $(".pipStop").onclick=()=>stopInline();
  $(".pipUnmute").onclick=()=>{ const v=ensureVideo(); v.muted=false; v.volume=1; toast("Unmuted 🔊"); };

  // drag pip window
  let pipDrag={on:false,dx:0,dy:0};
  pipHead.addEventListener("pointerdown",(e)=>{
    if(e.target.closest("button")) return;
    pipDrag.on=true;
    const r=pip.getBoundingClientRect();
    pipDrag.dx=e.clientX-r.left;
    pipDrag.dy=e.clientY-r.top;
    pipHead.setPointerCapture(e.pointerId);
  });
  pipHead.addEventListener("pointermove",(e)=>{
    if(!pipDrag.on) return;
    const x=e.clientX-pipDrag.dx;
    const y=e.clientY-pipDrag.dy;
    pip.style.left = Math.max(8, Math.min(innerWidth - pip.offsetWidth - 8, x)) + "px";
    pip.style.top  = Math.max(8, Math.min(innerHeight - pip.offsetHeight - 8, y)) + "px";
    pip.style.bottom="auto";
  });
  pipHead.addEventListener("pointerup",()=>pipDrag.on=false);
  pipHead.addEventListener("pointercancel",()=>pipDrag.on=false);

  // Mobile drag uses a dedicated grip, preserving scroll and desktop coordinates.
  const grip=inst.querySelector('.touchGrip');
  let touchDrag=null;
  const offset=(key)=>parseFloat(inst.style.getPropertyValue(key))||0;
  grip.addEventListener('pointerdown',e=>{
    if(!MOBILE_LAYOUT.matches||touchDrag||e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const r=core.getBoundingClientRect();
    touchDrag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:offset('--touchDX'),dy:offset('--touchDY'),left:r.left,top:r.top,w:r.width,h:r.height,scroll:WORLD.scrollTop};
    inst.classList.add('touchMoving');grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove',e=>{
    if(!touchDrag||touchDrag.id!==e.pointerId)return;
    e.preventDefault();const d=touchDrag, b=WORLD.getBoundingClientRect();
    const clamp=(v,min,max)=>Math.max(min,Math.min(Math.max(min,max),v));
    const x=clamp(d.left+e.clientX-d.x,b.left+8,b.right-d.w-8);
    const y=clamp(d.top+e.clientY-d.y,b.top+18,b.bottom-d.h-8);
    inst.style.setProperty('--touchDX',(d.dx+x-d.left)+'px');
    inst.style.setProperty('--touchDY',(d.dy+y-d.top+WORLD.scrollTop-d.scroll)+'px');
  });
  function endTouch(e){if(!touchDrag||touchDrag.id!==e.pointerId)return;touchDrag=null;inst.classList.remove('touchMoving');
  mobileMemory[id]={dx:offset('--touchDX'),dy:offset('--touchDY')};
  persistMobileMemory().then(()=>toast('Device Memory • posición guardada')).catch(()=>toast('Device Memory • no se pudo guardar'));
  }
  grip.addEventListener('pointerup',endTouch);grip.addEventListener('pointercancel',endTouch);grip.addEventListener('lostpointercapture',endTouch);
  grip.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();});
  // ===== Drag CORE (per instance) =====
  let drag={on:false,dx:0,dy:0};
  core.addEventListener("pointerdown",(e)=>{
    if(MOBILE_LAYOUT.matches)return;
    // don’t drag when clicking buttons/nodes
    if(e.target.closest("button") || e.target.closest(".node")) return;
    drag.on=true;
    core.classList.add("dragging");
    const r = inst.getBoundingClientRect();
    drag.dx = e.clientX - r.left;
    drag.dy = e.clientY - r.top;
    core.setPointerCapture(e.pointerId);
  });
  core.addEventListener("pointermove",(e)=>{
    if(!drag.on) return;
    const x = e.clientX - drag.dx;
    const y = e.clientY - drag.dy;
    inst.style.left = Math.max(8, Math.min(innerWidth - core.offsetWidth - 8, x)) + "px";
    inst.style.top  = Math.max(8, Math.min(innerHeight - core.offsetHeight - 8, y)) + "px";
    inst.style.transform = "none";
  });
  core.addEventListener("pointerup",()=>{
    if(!drag.on) return;
    drag.on=false;
    core.classList.remove("dragging");
    // save pos
    const r = inst.getBoundingClientRect();
    state.pos = { x: Math.round(r.left), y: Math.round(r.top) };
    save(true);
  });
  core.addEventListener("pointercancel",()=>{ drag.on=false; core.classList.remove("dragging"); });

  inst.addEventListener('tb-position-commit',()=>{if(MOBILE_LAYOUT.matches)return;const r=core.getBoundingClientRect();state.pos={x:Math.round(r.left),y:Math.round(r.top)};saveState(id,state);});
  // ===== Spider open/close =====
  $(".btnToggle").addEventListener("click",(e)=>{ e.stopPropagation(); core.classList.toggle("open"); });
  core.addEventListener("click",(e)=>{
    if(e.target.closest(".node") || e.target.closest("button")) return;
    core.classList.toggle("open");
  });

  // ===== Desktop color picker =====
  $(".btnPick").addEventListener("click", async (e)=>{
    e.stopPropagation();
    try{
      if(!("EyeDropper" in window)){
        toast("EyeDropper no disponible ❌");
        return;
      }
      const eye=new EyeDropper();
      const res=await eye.open();
      const col=res.sRGBHex;
      state.desk = hexToRgba(col, 0.12);
      state.accent = col;
      applyTheme(); save(true);
      toast("Desktop color ✅ " + col);
    }catch(_){ toast("Cancelado"); }
  });

  // ===== Modules =====
  const titles = {
    player:"🎬 Player + Queue + PiP",
    fav:"⭐ Favorites + Queue",
    m3u:"📺 M3U / Playlists",
    links:"🔗 Links / Apps",
    look:"🎨 Look + Card",
    social:"🌐 Social",
    ai:"🤖 AI",
    sys:"⚙️ System"
  };

  function renderModule(mod){
    dBody.innerHTML="";
    showDrawer(titles[mod]||"Módulo");
    if(mod==="player") renderPlayer();
    if(mod==="fav") renderFavs();
    if(mod==="m3u") renderM3U();
    if(mod==="links") renderLinks();
    if(mod==="look") renderLook();
    if(mod==="social") renderSocial();
    if(mod==="ai") renderAI();
    if(mod==="sys") renderSys();
  }

  $$(".node").forEach(n=>{
    n.addEventListener("click",(e)=>{
      e.stopPropagation();
      core.classList.add("open");
      renderModule(n.dataset.mod);
    });
  });

  function playerCardHtml(){
    const np=state.nowPlaying||{name:"",url:""};
    const qn=(state.queue||[]).length;
    const pipLabel = state.pipOn ? "📌 PiP ON" : "📌 PiP";
    return `
      <div class="card">
        <h3>Inline Player</h3>
        <p style="margin:0;font-size:12px;color:rgba(233,242,255,.9)"><b id="nowName">${esc(np.name||"—")}</b></p>
        <p style="margin:6px 0 0 0;font-size:11px;color:var(--muted);word-break:break-all" id="nowUrl">${esc(np.url||"")}</p>

        <div class="playerWrap" style="margin-top:10px">
          <div id="dockSlot"></div>
        </div>

        <div class="row" style="margin-top:10px">
          <button class="btn bad" id="pStop">⏹️ Stop</button>
          <button class="btn secondary" id="pUnmute">🔊 Unmute</button>
          <button class="btn" id="pNext">⏭️ Next (${qn})</button>
          <button class="btn" id="pPiP">${pipLabel}</button>
        </div>
        <p style="margin:10px 0 0 0;color:var(--muted);font-size:12px;">Play inicia <b>muted</b>.</p>
      </div>
    `;
  }

  function wirePlayerControls(){
    // dock video into drawer slot if pipOff
    const slot = inst.querySelector("#dockSlot");
    if(slot && !state.pipOn){
      slot.innerHTML="";
      slot.appendChild(ensureVideo());
    }else if(state.pipOn){
      dockToPiP();
    }

    inst.querySelector("#pStop")?.addEventListener("click", stopInline);
    inst.querySelector("#pUnmute")?.addEventListener("click", ()=>{
      const v=ensureVideo(); v.muted=false; v.volume=1; toast("Unmuted 🔊");
    });
    inst.querySelector("#pNext")?.addEventListener("click", ()=>playNextFromQueue());
    inst.querySelector("#pPiP")?.addEventListener("click", ()=>{
      if(state.pipOn){
        state.pipOn=false; save(true);
        dockToDrawer();
        toast("PiP OFF");
      }else{
        state.pipOn=true; save(true);
        dockToPiP();
        toast("PiP ON ✅");
      }
      const b=inst.querySelector("#pPiP");
      if(b) b.textContent = state.pipOn ? "📌 PiP ON" : "📌 PiP";
    });
    updatePipTitle();
  }

  function renderQueueSection(){
    const box = inst.querySelector("#qList");
    if(!box) return;
    box.innerHTML="";
    (state.queue||[]).forEach((x,idx)=>{
      const div=document.createElement("div");
      div.className="item";
      div.innerHTML=`
        <div style="min-width:0">
          <b style="font-size:12px">${esc(x.name||"Queue")}</b>
          <small>${esc(x.url)}</small>
        </div>
        <div class="row" style="justify-content:flex-end">
          <button class="btn good" data-play="${idx}">▶️</button>
          <button class="btn bad" data-del="${idx}">🗑️</button>
        </div>
      `;
      div.querySelector("[data-del]").onclick=()=>{
        state.queue.splice(idx,1); save(true); renderQueueSection();
      };
      div.querySelector("[data-play]").onclick=()=>{
        const item = state.queue.splice(idx,1)[0];
        save(true);
        playInline(item.url, item.name||"Queue");
        renderQueueSection();
      };
      box.appendChild(div);
    });
    const pNext=inst.querySelector("#pNext");
    if(pNext) pNext.textContent=`⏭️ Next (${(state.queue||[]).length})`;
  }

  function renderPlayer(){
    dBody.innerHTML = `
      ${playerCardHtml()}
      <div class="card">
        <h3>URL</h3>
        <p>Pega (.m3u8/mp4). Play inicia muted. Puedes añadir a Queue o Favorites.</p>
        <input id="pUrl" placeholder="https://.../stream.m3u8" value="${esc(state.playerUrl)}">
        <input id="pName" style="margin-top:8px" placeholder="Nombre (opcional)">
        <div class="row" style="margin-top:10px">
          <button class="btn good" id="pPlay">▶️ Play</button>
          <button class="btn" id="pQ">➕ Queue</button>

    function addSocial(name,url){
      url=cleanUrl(url);
      if(!looksLikeUrl(url)) return false;
      state.socials=state.socials||[];
      const exists=state.socials.some(x=>String(x.url).trim()===url);
      if(!exists) state.socials.unshift({name:(name||"Nuevo sitio").trim(), url});

    inst.querySelector("#sBulkImport").onclick=()=>importSocialText(inst.querySelector("#sBulk").value||"");
    inst.querySelector("#sImportBtn").onclick=()=>inst.querySelector("#sFile").click();
    inst.querySelector("#sFile").onchange=async(e)=>{
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      importSocialText(await f.text());
      e.target.value="";
    };
    draw();
  }

        <h3>BUTTON JSON — Import / Export</h3>
        <div class="row">
          <button class="btn" id="exp">Export JSON</button>
          <button class="btn good" id="buttonDeploy">Deploy Button JSON</button>
          <input id="buttonImportFile" type="file" accept=".json,application/json">
        </div>
        <textarea id="box" style="margin-top:10px" placeholder="JSON..."></textarea>
      </div>
  <div class="card">
        <h3>🗂️ STAGE LIBRARY V1</h3>
        <p>Setup completo de todos los clones. Independiente de AI y Auto Save.</p>
        <input id="stageName" type="text" maxlength="120" placeholder="Stage name">
        <div class="row"><button class="btn good" id="stageSave">💾 Save New Stage</button></div>
        <p>Import Stage JSON</p><input id="stageImport" type="file" accept=".json,application/json">
        <button class="btn good" id="stageDeploy" disabled>🚀 Deploy Stage</button>
        <p id="stageStatus" role="status"></p><div id="stageList"></div>
      </div>
    `;

    mountStageLibrary(inst);
    inst.querySelector("#mobileArrange").onclick=async()=>{if(!MOBILE_LAYOUT.matches){toast('Auto Arrange disponible en móvil');return;}for(const el of WORLD.querySelectorAll(".tbInst")){delete mobileMemory[el.dataset.id];el.style.removeProperty("--touchDX");el.style.removeProperty("--touchDY");}layoutMobile();hideDrawer();core.classList.remove("open");try{await persistMobileMemory();toast("Auto Layout restaurado y guardado");}catch(e){toast("Auto Layout restaurado; no se pudo guardar");}};
    inst.querySelector("#cloneMe").onclick=async()=>{try{await cloneInstance(id);hideDrawer();core.classList.remove("open");}catch(e){toast("Clone error: "+e.message);}};
    inst.querySelector("#buttonImportFile").onchange=async(e)=>{try{const f=e.target.files[0];if(f)inst.querySelector("#box").value=await f.text();}catch(err){toast(err.message);}};
    inst.querySelector("#buttonDeploy").onclick=async()=>{try{const raw=JSON.parse(inst.querySelector("#box").value);if(raw.format===STAGE_FORMAT)throw Error("Usa Stage Library para un Stage completo");deployButtonState(raw,inst);await flushActive();hideDrawer();core.classList.remove("open");toast("Button desplegado ✅");}catch(e){toast("Import error: "+e.message);}};

    inst.querySelector("#resetMe").onclick=async()=>{
      if(!confirm("RESET THIS borrará los ajustes, enlaces y favoritos guardados de ESTE botón. No afectará Control Center ni el lanzador AI. ¿Continuar?")) return;
      removeActive(id);
      try{await flushActive();location.reload();}catch(e){toast(e.message);}
    };

    inst.querySelector("#deleteMe").onclick=()=>{
      // remove storage
      removeActive(id);
      // remove from index
      const idx=loadIndex().filter(x=>x!==id);
      saveIndex(idx);
      // remove DOM
      inst.remove();
      delete mobileMemory[id];persistMobileMemory().catch(()=>toast("Device Memory: no se pudo limpiar"));
      layoutMobile();
      toast("Eliminado ✅");
    };

    inst.querySelector("#exp").onclick=()=>{
      inst.querySelector("#box").value = JSON.stringify(state, null, 2);
      inst.querySelector("#box").focus();
      inst.querySelector("#box").select();
      toast("Exportado ✅");
    };
  }

  // global key handling: esc closes ONLY this instance if focused/open
  document.addEventListener("keydown",(e)=>{
    if(e.key==="Escape"){
      core.classList.remove("open");
      hideDrawer();
    }
  });

  // initial apply
  applyTheme();
  applyText();
  applyCardLogo();

  // restore pip
  if(state.pipOn){ pip.classList.add("show"); updatePipTitle(); }
}

function recoveryNotice(message){
 const el=document.createElement('div');el.style.cssText='position:fixed;z-index:2147483647;top:8px;left:8px;right:8px;padding:12px;background:#142b43;color:white;font:14px system-ui;border:1px solid #55bfff;border-radius:10px;max-height:40vh;overflow:auto';
 el.textContent='CUERVO V1.6 • '+message+' ';const close=document.createElement('button');close.textContent='Cerrar';close.onclick=()=>el.remove();el.append(close);document.body.append(el);
}
(async function boot(){
 await initActive();
 await initMobileMemory();
 const idx=loadIndex();let mounted=0;const errors=[];
 for(const id of idx){try{createInstance({id,state:loadState(id),place:'manual'});mounted++;}catch(e){for(const el of WORLD.querySelectorAll('.tbInst'))if(el.dataset.id===id)el.remove();errors.push(e.message);}}
 if(!idx.length){const id=uid(),st=defaultState();saveState(id,st);createInstance({id,state:st,place:'center'});mounted++;}
 if(errors.length) recoveryNotice('Botones visibles: '+mounted+'/'+idx.length+'. Error: '+errors.join(' | ')+'. No se borraron los datos.');
 if(!mounted&&idx.length){const el=document.createElement('button');el.textContent='Abrir botón de recuperación (sin borrar Stage)';el.style.cssText='position:fixed;top:48%;left:10%;width:80%;padding:18px;z-index:99999';el.onclick=()=>{try{const id=uid();createInstance({id,state:defaultState()});el.remove();}catch(e){recoveryNotice(e.message);}};document.body.append(el);}
 requestAnimationFrame(()=>WORLD.querySelectorAll('.tbInst').forEach(el=>{const r=el.getBoundingClientRect();fitButtonViewport(el,r.left,r.top);}));
})().catch(e=>recoveryNotice('Error de inicio: '+e.message+' • No borres tus datos.'));
</script>
